name: Deploy to Firebase Staging and e2e test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase for client
        env:
          NODE_ENV: staging
          GET_PRIME_URL: ${{ secrets.GET_PRIME_URL_STAGING }}
        run: npm run deploy:staging -w client

      - name: Deploy to Firebase for server
        run: npm run deploy:staging -w server
